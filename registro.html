<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Librería</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Librería Duoc</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-contenedor">
            <h2>Crear Cuenta</h2>
            <form id="formRegistro">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre" required>

                <label>Correo Institucional:</label>
                <input type="email" id="correo" placeholder="ejemplo@duoc.cl" required>

                <label>RUN (sin puntos ni guion):</label>
                <input type="text" id="run" required>

                <label>Clave (4-10 caracteres):</label>
                <input type="password" id="clave" required>

                <label>Región:</label>
                <select id="region" onchange="cargarComunas()">
                    <option value="">Seleccione...</option>
                    <option value="Metropolitana">Metropolitana</option>
                    <option value="Valparaiso">Valparaíso</option>
                </select>

                <label>Comuna:</label>
                <select id="comuna">
                    <option value="">Seleccione región primero</option>
                </select>

                <button type="submit">Registrar Usuario</button>
            </form>
            <div id="errores" style="color: red; margin-top:10px;"></div>
        </div>
    </main>

    <script src="js/validaciones.js"></script>
</body>
</html>
